name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test, Lint & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK & accept licenses
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -r | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "Error: sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36.1" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compute CI APK version metadata
        id: version
        shell: bash
        run: |
          source version.properties
          BASE_SEMVER="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            APP_VERSION_NAME="${BASE_SEMVER}-pr.${GITHUB_EVENT_NUMBER}.${SHORT_SHA}"
          else
            APP_VERSION_NAME="${BASE_SEMVER}-ci.${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
          fi
          APP_VERSION_CODE=$(( ${VERSION_CODE:-1} + ${GITHUB_RUN_NUMBER:-0} ))
          echo "version_name=${APP_VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${APP_VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_NAME=${APP_VERSION_NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${APP_VERSION_CODE}" >> "$GITHUB_ENV"

      - name: Ensure debug keystore exists
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run unit & Robolectric Compose UI tests
        run: |
          gradle :app:testDebugUnitTest \
            -PappVersionName="${{ steps.version.outputs.version_name }}" \
            -PappVersionCode="${{ steps.version.outputs.version_code }}"

      - name: Run Android Lint
        run: |
          gradle :app:lintDebug \
            -PappVersionName="${{ steps.version.outputs.version_name }}" \
            -PappVersionCode="${{ steps.version.outputs.version_code }}"

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            -PappVersionName="${{ steps.version.outputs.version_name }}" \
            -PappVersionCode="${{ steps.version.outputs.version_code }}"

      - name: Stage versioned Debug APK
        shell: bash
        run: |
          mkdir -p dist
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          APK_DEST="dist/Vesper-v${{ steps.version.outputs.version_name }}-debug.apk"
          cp "$APK_SRC" "$APK_DEST"
          (cd dist && sha256sum "$(basename "$APK_DEST")" > "Vesper-v${{ steps.version.outputs.version_name }}-checksums.txt")
          ls -lh dist

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vesper-v${{ steps.version.outputs.version_name }}-debug-apk
          path: dist/
          retention-days: 14

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-run-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          retention-days: 7
